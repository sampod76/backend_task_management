name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Release version tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.version_tag }}
  cancel-in-progress: false

jobs:
  release-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "${{ inputs.version_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "version_tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
